name: bilheteria-lab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bilheteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilheteria}
      POSTGRES_DB: ${POSTGRES_DB:-bilheteria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-gateway:
    build: ./mock-gateway
    environment:
      MOCK_GATEWAY_PORT: ${MOCK_GATEWAY_PORT:-8080}
    ports:
      - "${MOCK_GATEWAY_PORT:-8080}:${MOCK_GATEWAY_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MOCK_GATEWAY_PORT}/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: postgres://${POSTGRES_USER:-bilheteria}:${POSTGRES_PASSWORD:-bilheteria}@db:5432/${POSTGRES_DB:-bilheteria}
      PAYMENT_GATEWAY_URL: http://mock-gateway:${MOCK_GATEWAY_PORT:-8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
      mock-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    environment:
      API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
